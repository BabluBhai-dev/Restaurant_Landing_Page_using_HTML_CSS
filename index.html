<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foodie Restaurant</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="Image/Favicon/Icon.png" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="logo">Foodie</div>

      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Menu</a></li>
        <li><a href="#">Reviews</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

    <!-- hero section -->
    <div class="hero">
      <div class="overlay">
        <div class="hero-content">
          <h1>Enjoy Delicious Food</h1>
          <p>Fresh ingredients, amazing taste, unforgettable experience.</p>
          <button>Order Now</button>
        </div>
      </div>
    </div>

    <!-- features -->
     <section class="features">
        <div class="feature">
            <h3>🚚 Fast Delivery</h3>
        </div>
        <div class="feature">
            <h3>🍔 Fresh Food</h3>
        </div>
          <div class="feature">
            <h3>⭐ Top Rated</h3>
        </div>
     </section>

     <!--Menu  -->
     <section class="menu">
        <h2>Popular Dishes</h2>
        <div class="cards">
            <div class="card">
                <img src="Image/cards/card1.jfif" alt="food image">
                <h3>Pizza</h3>
                <p>$12</p>
                <button>Order</button>
            </div>
               <div class="card">
                <img src="Image/cards/card2.jfif" alt="food image">
                <h3>Burger</h3>
                <p>$10</p>
                <button>Order</button>
            </div>
               <div class="card">
                <img src="Image/cards/card3.jpg" alt="food image">
                <h3>Pasta</h3>
                <p>$15</p>
                <button>Order</button>
            </div>
        </div>
     </section>
  </body>
</html>
